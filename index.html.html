
<!DOCTYPE html>
<!-- Indica que estamos utilizando HTML5 -->

<html lang="es">
<!-- Indica que el idioma de la página es español -->

<head>
    <!-- Información y configuración de la página -->

    <meta charset="UTF-8">
    <!-- Permite utilizar letras como ñ, á, é, í, ó, ú -->

    <title>Mi primera página web</title>
    <!-- Título que aparece en la pestaña del navegador -->


    <!-- ========== INICIO DE CSS ========== -->
    <style>

        /* BODY: cambia el estilo general de la página */
        body {
            /* Color de fondo de toda la página */
            background-color: lightblue;
        }

        /* H1: modifica todos los títulos principales */
        h1 {
            /* Cambia el color del título a azul oscuro */
            color: darkblue;
        }

        /* P: modifica todos los párrafos */
        p {
            /* Tipo de letra: Arial */
            font-family: Arial, sans-serif;

            /* Tamaño de la letra: 24 píxeles */
            font-size: 24px;

            /* Color del texto: verde oscuro */
            color: darkgreen;
        }

    </style>
    <!-- ========== FIN DE CSS ========== -->

</head>


<!-- ========== INICIO DEL BODY ========== -->
<!-- Todo lo que está dentro del body aparece en la página -->

<body>

    <!-- H1: título principal -->
    <h1>¡Hola! Soy Danner</h1>


    <!-- H2: subtítulo -->
    <h2>Sobre mí</h2>

    <!-- P: primer párrafo -->
    <p>Estoy aprendiendo HTML y CSS.</p>

    <!-- P: segundo párrafo -->
    <p>Me gusta el deporte, viajar y aprender cosas nuevas.</p>


    <!-- H2: subtítulo de mis aficiones -->
    <h2>Mis aficiones</h2>

    <!-- UL: crea una lista sin numeración -->
    <ul>

        <!-- LI: primer elemento de la lista -->
        <li>Jugar al fútbol</li>

        <!-- LI: segundo elemento de la lista -->
        <li>Viajar</li>

        <!-- LI: tercer elemento de la lista -->
        <li>Aprender programación</li>

    </ul>


    <!-- H2: subtítulo de contacto -->
    <h2>Contacto</h2>

    <!-- P: párrafo de contacto -->
    <p>Puedes visitar mi página favorita:</p>

    <!-- A: crea un enlace -->
    <!-- HREF: indica la dirección a la que lleva -->
    <a href="https://www.google.com">Visitar Google</a>

</body>
<!-- ========== FIN DEL BODY ========== -->

</html>
<!-- Fin del documento HTML -->
